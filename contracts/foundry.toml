[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
# HyperEVM mainnet (chain 999) doesn't support EIP-3855 (PUSH0). Pinning
# to paris (pre-Shanghai) prevents the compiler from emitting PUSH0 so
# the same artifact runs on both testnet and mainnet.
evm_version = "paris"
optimizer = true
optimizer_runs = 200
# PR 6f: vault accumulated enough external functions across PRs 6a/6b/6c/6d/6f
# that solc's default codegen blows the EVM stack at ABI dispatch. via_ir
# uses the Yul intermediate representation which handles deep dispatch
# without overflow. Compatible with the rest of the toolchain.
via_ir = true
remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/",
    "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
hyperevm_testnet = "https://rpc.hyperliquid-testnet.xyz/evm"
hyperevm_mainnet = "https://rpc.hyperliquid.xyz/evm"
