[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
# HyperEVM mainnet (chain 999) doesn't support EIP-3855 (PUSH0). Pinning
# to paris (pre-Shanghai) prevents the compiler from emitting PUSH0 so
# the same artifact runs on both testnet and mainnet.
evm_version = "paris"
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/",
    "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
hyperevm_testnet = "https://rpc.hyperliquid-testnet.xyz/evm"
hyperevm_mainnet = "https://rpc.hyperliquid.xyz/evm"
